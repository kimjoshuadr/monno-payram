name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static checks (pin + overlays)
        run: node scripts/verify-static.mjs

      - name: Build image
        run: |
          VERSION=$(cat VERSION)
          docker build --build-arg PAYRAM_VERSION="$VERSION" -t monno-payram:ci .

      - name: Overlays landed in the image
        run: |
          docker run --rm --entrypoint sh monno-payram:ci -lc 'test -f /web/public/sso.html'
          docker run --rm --entrypoint sh monno-payram:ci -lc 'grep -q payram_access_token /web/public/sso.html'
          docker run --rm --entrypoint sh monno-payram:ci -lc 'test -f /web/public/monno-ui.js'

      - name: Gate is present in the vendor routing table
        run: |
          docker run --rm --entrypoint sh monno-payram:ci -lc 'grep -q "sub_filter" /etc/nginx/payram-locations.conf'
          docker run --rm --entrypoint sh monno-payram:ci -lc 'grep -q "monno-ui.js" /etc/nginx/payram-locations.conf'
          docker run --rm --entrypoint sh monno-payram:ci -lc 'grep -q "proxy_pass http://payram_frontend" /etc/nginx/payram-locations.conf'

      - name: Vendor routing table is otherwise intact
        run: |
          docker run --rm --entrypoint sh monno-payram:ci -lc 'grep -q "location /api/v1/" /etc/nginx/payram-locations.conf'
          docker run --rm --entrypoint sh monno-payram:ci -lc 'grep -q "location /api/v1/ws" /etc/nginx/payram-locations.conf'
